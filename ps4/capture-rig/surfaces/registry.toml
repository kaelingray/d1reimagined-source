# ============================================================================================
# d1-scope SURFACE REGISTRY - DRAFT (RECON C, 2026-08-10)
# ============================================================================================
#
# WHAT THIS IS
# ------------
# One address book for every [C] runtime surface this project has earned, expressed in
# **d1-live's address grammar, verbatim** (crates/d1-live/src/addr.rs):
#
#     bare 0xNNN   an EBOOT VADDR   -> base + N          (the project idiom)
#     v:0xNNN      an eboot vaddr   -> base + N          (explicit form)
#     a:0xNNN      an ABSOLUTE addr -> N                 (heap pointers read OUT of memory)
#     [ EXPR ]     deref u64
#     EXPR + N     after `+`, a bare number is an OFFSET, never a vaddr
#     NAME         a capture-rig/guest-symbols.json symbol
#
# ⛔ DO NOT FORK THE GRAMMAR. d1-scope resolves every `addr` here by handing the string to
#    d1-live. A second parser is how "same address, different space" ships twice.
#
# HOW d1-scope USES IT
# --------------------
#   rw = "write"  the surface is DATA:  d1-live watch --addr <addr>+<field.off> --len <n>
#   rw = "exec"   the surface is CODE:  d1-live watch --rw exec --addr <addr>
#   rw = "read"   snapshot-only: no watchpoint is meaningful (it is a layout, not an event)
#
# ⛔ d1-scope links NO ptrace. It SPAWNS d1-live as a child, always with a bounded
#    --max-seconds lease, and stops it with SIGTERM. NEVER SIGKILL: a tracer that dies armed
#    kills its target (measured, not theoretical).
#
# THE FIELDS OF A SURFACE
# -----------------------
#   name        stable id (snake_case). d1-scope's CLI handle.
#   group       one of: ladder wire-kept queuez derived session simulation game world
#   addr        d1-live address expression for the surface BASE.
#               ⛔ THREE RESERVED VALUES, and they are NOT addresses:
#                 "[U]"              the address is unknown - see the matching [[open]] entry
#                 "NOT-EXPRESSIBLE"  the address needs arithmetic the grammar does not have
#                                    (shifts, masks, multiplies). Such a surface carries
#                                    `addr_input` + `addr_input_width` (a legal ADDRESS
#                                    expression and the width to load from it, yielding the
#                                    resolver's argument) and `resolver` (the name of the
#                                    surface whose documented algorithm turns it into an
#                                    address). ⚠ `addr_input` is an ADDRESS, never a value
#                                    expression - `u32@…` belongs in `addr_input_width`, not
#                                    in the string, because d1-live's grammar deliberately
#                                    treats a bare number differently in the two positions.
#               ⭐ THE RAIL THIS ENFORCES: rather than smuggle a pseudo-function like
#                 `resolve(...)` into an addr string, say out loud that the grammar cannot
#                 express it. A second grammar is how "same address, different space" ships
#                 twice. d1-scope implements resolvers in Rust and hands d1-live only `a:0x…`.
#               ⚠ `controls[].expr` is PROSE-WITH-EXPRESSIONS, not grammar - it may contain
#                 `resolve(…)`, `popcount(…)`, `count(type == 9)`. Only `addr` and `addr_input`
#                 are parsed.
#   rw          write | exec | read
#   confidence  [C] [O] [R] [I] [U]  (CLAUDE.md's convention)
#   reach       observed-live | static-client-inference | synthetic_ancestor | ...
#   liveness    a PREDICATE that must hold before any read of this surface is admissible.
#               ⚠ Written as an expression + expected relation, NOT as prose. A surface whose
#               liveness predicate fails yields "not measurable", never "was zero".
#   source      where it came from (doc §, script, or this session's verification)
#   fields      [{name, off, ty, note}]
#   controls    [{snap, expr, ty, value, verified, note}]
#               verified = true means THIS SESSION read it back offline with d1-replay.
#
# ============================================================================================
# ⛔⛔ THREE THINGS TO READ BEFORE TRUSTING ANY CONTROL BELOW
# ============================================================================================
#
# 1. `runs/snapshots/rung36-biped-chain.snap` IS POKE-CONTAMINATED IN THREE FIELDS.
#    `historicaldocs/design/player-creation-chain.md` §4 journals six pokes taken before that capture. Three
#    of them are surfaces in this registry, and the snapshot therefore records the POKED value,
#    not the client's own:
#        session_player_set  +0x90    -1,-1,-1  ->  0,-1,-1   (poke 6)
#        sim_player_set      +0x10     0        ->  1         (poke 3)
#        sim_player_set      +0x18 slot 0       <- copied from P (pokes 4/5)
#    ⭐ The PRISTINE values are carried by `rung34-task8-cleared-registry.snap` and
#    `orbit-all.snap`, which read `-1,-1,-1` and `0`. Every such control below names BOTH.
#
# 2. ⛔ THE SOBJECT LIVENESS RULE IN THE BRIEF IS A SUPERSET, NOT THE PREDICATE.
#    "u16 @ sobject+0x08 has 0xFF in the high byte" counts 577 in-world and **63** in orbit.
#    The pool's OWN occupancy bit vector popcounts **567 / 577 / 53**. Measured this session:
#        only-highbyte = 10 (indices 0..9, occupancy bit CLEAR)   only-bit = 0 (always)
#    ⇒ the high-byte rule NEVER misses a live object (safe for a "zero type 9" negative) but
#      over-counts stale slots. **One of those stale slots is type 11 = WEAPON.** Using the
#      high-byte rule alone reports "1 weapon in-world"; the bit vector says zero, and
#      `biped-census.md` §4.1's zero is the right answer.
#    ⭐ THIS IS WHY `CLAUDE.md` SAYS "63 in orbit" AND `biped-census.md` SAYS "53" - two
#      predicates, never reconciled. `sobjects_bitvec` below is authoritative; the high-byte
#      rule is retained as `sobject_element.typeword` and labelled a SUPERSET.
#
# 3. A read outside a captured region is UNMAPPED, not zero. `d1-replay` exits 1 and says so.
#    Every control row carries the snapshot it was read from because coverage differs wildly:
#    `--preset content` (rung36-biped-chain, 61 MB) has P/Q/sobjects/players but NOT the SSTM,
#    the cinematic manager, the activity loader, game globals or the unlock plane.
#    `orbit-all.snap` (1.6 GB) has everything and is the coverage reference.
#
# ============================================================================================

