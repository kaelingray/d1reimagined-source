# ============================================================================================
# EDGES - the flow graph. One row per DOCUMENTED hop between two surfaces.
# ============================================================================================
#
# WHY EDGES LIVE HERE AND NOT IN CODE
# -----------------------------------
# A surface is an address. An edge is a CLAIM about causation, and every claim in this project
# has to carry its evidence next to it or it gets re-derived wrong six hours later. Both halves
# are data; `d1-scope` is the renderer, not the author.
#
# ⛔⛔ FOUR STATES, AND COLLAPSING ANY TWO OF THEM MIS-ACCUSES AN EDGE
# --------------------------------------------------------------------
#   green    upstream populated AND downstream populated.
#   red      upstream populated AND downstream NOT. ⭐ This is the only state that accuses.
#   grey     upstream NOT populated ⇒ the edge has never been exercised. It is UNTESTED, not
#            broken. E-17 and E-20 are grey today: Q+0x10 == 0, so their upstream arm is false
#            and rendering them red would charge them with E-15's failure.
#   unknown  a field could not be READ - the region was not captured, or the address is [U].
#            ⭐ "not captured" and "was zero" are different facts and only one is evidence.
#            A surface read outside a snapshot's captured extent renders UNMAPPED, NEVER 0.
#   retired  the edge is dead BY CONSTRUCTION and must never be drawn red again. E-18 only.
#
# FIELDS
#   id                E-NN, stable. Cite it in prose.
#   up / down         a `surface.name` from this file, OR `server:<name>` (a wire/receipt-side
#                     endpoint that is NOT client memory and cannot be read offline), OR
#                     `[U]:<name>` (a client surface whose address is still unknown - every one
#                     of these has an [[open]] entry).
#   mech              one phrase: what carries the value across.
#   green / red       PREDICATES over surface fields, in this file's control-expression dialect
#                     (prose-with-expressions: `resolve()`, `popcount()`, `count()` allowed).
#                     ⚠ NOT the address grammar. Only `addr` / `addr_input` are parsed.
#   state             green | red | grey | unknown | retired  - as last MEASURED, with `as_of`.
#   evaluable_offline true iff both arms can be evaluated from a snapshot in [[meta.snapshot]].
#   guard             a condition under which the predicate is INVALID and must not be shown.
#
# ⭐ THE GRAPH'S POSITIVE CONTROL IS E-19. A view with no green edge inside the failing region
#   cannot tell "broken" from "not measured". E-19 is measured green on the simulation side and
#   localises the break strictly downstream of the producer's four entry gates.

